[package]
name = "invgen-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_yaml_ng = "0.10.0"

[dependencies.invgen]
path = ".."

# Its own workspace (and lockfile), so the main package never builds it.
[workspace]
members = []

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
