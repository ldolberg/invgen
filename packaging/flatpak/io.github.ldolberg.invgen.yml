# Flatpak manifest. Build and install locally with `make flatpak`.
# cargo-sources.json is generated from Cargo.lock (`make flatpak-sources`),
# so the build runs fully offline as Flatpak requires.
id: io.github.ldolberg.invgen
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: invgen

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Invoices live in ~/Documents/Invoices by default; other places can be
  # opened through the file chooser portal.
  - --filesystem=xdg-documents
  # Shared with the native build: ~/.config/invgen/config.yaml
  - --filesystem=xdg-config/invgen:create

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/invgen/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: invgen
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline build --release --locked
      - install -Dm755 target/release/invgen /app/bin/invgen
      - install -Dm644 packaging/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 packaging/${FLATPAK_ID}.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 packaging/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - dist
          - .flatpak-builder
          - build-flatpak
          - build-flatpak-repo
          - build-pages
          - .git
      - cargo-sources.json
