  <!-- header: bold accent bar -->
  <rect x="70" y="52" width="68" height="20" rx="10" fill="url(#accent)"/>

  <!-- line items -->
  <rect x="70" y="100" width="116" height="12" rx="6" fill="#94a3b8"/>
  <rect x="70" y="126" width="116" height="12" rx="6" fill="#94a3b8"/>
  <rect x="70" y="152" width="76" height="12" rx="6" fill="#94a3b8"/>

  <!-- total: the bold accent block -->
