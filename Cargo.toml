[package]
name = "invgen"
version = "0.1.2"
edition = "2024"
description = "Markdown invoices to beautiful PDFs, with a live-preview editor"
license = "MIT"
repository = "https://github.com/ldolberg/invgen"
readme = "README.md"
keywords = ["invoice", "pdf", "markdown", "typst"]
categories = ["command-line-utilities", "gui"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify = "8.2.1"
pulldown-cmark = "0.13.6"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["scan-fonts", "embedded-fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"

[dev-dependencies]
tempfile = "3.27.0"
