# Release on a version tag: push `vX.Y.Z` (matching Cargo.toml) and this
#   1. tests the crate,
#   2. builds the x86_64 Linux tarball, a universal macOS zip and an x86_64
#      Windows zip (each smoke tested by rendering an example invoice),
#   3. builds the Flatpak, signs it into the OSTree repo on gh-pages and pushes it
#      (https://ldolberg.github.io/invgen/), plus a single-file .flatpak bundle,
#   4. creates the GitHub release with all artifacts and their checksums,
#   5. publishes the crate to crates.io.
#
# Manual runs (Actions > Release > Run workflow) are dry runs: everything is
# built, nothing is pushed or released (crates.io gets `cargo publish --dry-run`).
#
# Secrets:
#   FLATPAK_GPG_PRIVATE_KEY, the armored key from
#     GNUPGHOME=~/.local/share/invgen/flatpak-gpg gpg --armor --export-secret-keys
#   CARGO_REGISTRY_TOKEN, a crates.io API token with the publish-update scope
#     (publish-new for the very first release).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_ID: io.github.ldolberg.invgen
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ github.event_name == 'push' && '1' || '0' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          grep -q "<release version=\"$version\"" packaging/$APP_ID.metainfo.xml \
            || { echo "::error::no <release version=\"$version\"> in metainfo.xml"; exit 1; }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  tarball:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: make dist
      - name: Smoke test
        env:
          INVGEN_CONFIG: examples/config.yaml
        run: |
          dist/invgen-v*-x86_64-linux/invgen build examples/invoices/EINV-2026-20.md -o "$RUNNER_TEMP/smoke.pdf"
          head -c 5 "$RUNNER_TEMP/smoke.pdf" | grep -q '%PDF-'
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: dist/*.tar.gz*

  macos:
    needs: check
    runs-on: macos-14
    env:
      VERSION: ${{ needs.check.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build a universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/invgen \
            target/aarch64-apple-darwin/release/invgen \
            target/x86_64-apple-darwin/release/invgen
          strip dist/invgen
          lipo -info dist/invgen
      - name: Smoke test
        env:
          INVGEN_CONFIG: examples/config.yaml
        run: |
          dist/invgen build examples/invoices/EINV-2026-20.md -o "$RUNNER_TEMP/smoke.pdf"
          head -c 5 "$RUNNER_TEMP/smoke.pdf" | grep -q '%PDF-'
      - name: Zip
        run: |
          name=invgen-v$VERSION-macos-universal
          mkdir -p "dist/$name"
          cp dist/invgen README.md LICENSE docs/FORMAT.md examples/config.yaml "dist/$name/"
          cp -r examples/invoices "dist/$name/"
          (cd dist && zip -qr "$name.zip" "$name" && shasum -a 256 "$name.zip" > "$name.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip*

  windows:
    needs: check
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Smoke test
        env:
          INVGEN_CONFIG: examples/config.yaml
        run: |
          target/release/invgen.exe build examples/invoices/EINV-2026-20.md -o "$RUNNER_TEMP/smoke.pdf"
          head -c 5 "$RUNNER_TEMP/smoke.pdf" | grep -q '%PDF-'
      - name: Zip
        run: |
          name=invgen-v$VERSION-x86_64-windows
          mkdir -p "dist/$name"
          cp target/release/invgen.exe README.md LICENSE docs/FORMAT.md examples/config.yaml "dist/$name/"
          cp -r examples/invoices "dist/$name/"
          (cd dist && 7z a -tzip -bd "$name.zip" "$name" > /dev/null && sha256sum "$name.zip" > "$name.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip*

  flatpak:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # push to gh-pages
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install flatpak-builder and the Flathub remote
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/flatpak/*') }}
          restore-keys: flatpak-builder-
      - name: Import signing key
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::secret FLATPAK_GPG_PRIVATE_KEY is not set"; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$KEY" | gpg --batch --import
          echo "FLATPAK_GPG_HOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Build, sign and publish to gh-pages
        env:
          FLATPAK_BUILDER: flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse
          PUBLISH_PUSH: ${{ env.PUBLISH }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          packaging/flatpak/publish.sh
      - name: Bundle
        run: |
          mkdir -p dist
          bundle=dist/invgen-v$VERSION-x86_64.flatpak
          flatpak build-bundle build-pages/repo "$bundle" "$APP_ID" stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          (cd dist && sha256sum "$(basename "$bundle")" > "$(basename "$bundle").sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*.flatpak*

  release:
    needs: [check, tarball, macos, windows, flatpak]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from metainfo.xml
        run: |
          python3 - "$VERSION" > notes.md <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("packaging/io.github.ldolberg.invgen.metainfo.xml").getroot()
          rel = root.find(f".//release[@version='{sys.argv[1]}']")
          for el in rel.find("description"):
              text = " ".join("".join(el.itertext()).split())
              print(text if el.tag == "p" else "\n".join("- " + " ".join("".join(li.itertext()).split()) for li in el))
              print()
          print("Install with Flatpak:\n\n```sh\nflatpak install --user https://ldolberg.github.io/invgen/io.github.ldolberg.invgen.flatpakref\n```\n")
          print("Or with Cargo: `cargo install invgen --locked`. macOS and Windows zips are below; see the README for first-run notes.")
          EOF
          cat notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "invgen $GITHUB_REF_NAME" --notes-file notes.md

  crates-io:
    # Runs after every build succeeded, so a broken platform never leaves a
    # published crate without a matching release.
    needs: [check, tarball, macos, windows, flatpak]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Dry run
        if: env.PUBLISH != '1'
        run: cargo publish --locked --dry-run
      - name: Publish
        if: env.PUBLISH == '1'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] || { echo "::error::secret CARGO_REGISTRY_TOKEN is not set"; exit 1; }
          # Re-running a tag must not fail on a version that is already up.
          if curl -fsS -A "invgen-release (github.com/ldolberg/invgen)" \
              "https://crates.io/api/v1/crates/invgen/$VERSION" > /dev/null 2>&1; then
            echo "invgen $VERSION is already on crates.io, skipping"
            exit 0
          fi
          cargo publish --locked
